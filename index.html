<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoWo - Conscious World App</title>
<meta name="description" content="CoWo webova aplikace pro meditace, komunitu, knihovnu, kalendar praxe, cestovani a vedomy denik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--card:#fffdf8;--ink:#16211f;--muted:#66736f;--line:rgba(22,33,31,.13);--coral:#ef5d3d;--teal:#008b83;--gold:#f4b34f;--violet:#6545d8;--shadow:0 20px 60px rgba(24,35,32,.14)}body.dark{--bg:#09110f;--card:#121d1a;--ink:#f8f3e9;--muted:#aab8b4;--line:rgba(248,243,233,.15);--shadow:0 20px 70px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,rgba(239,93,61,.13),transparent 34rem),radial-gradient(circle at 90% 0,rgba(0,139,131,.18),transparent 32rem),var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}img{max-width:100%;display:block}.app{display:grid;min-height:100vh;grid-template-columns:280px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px)}.logo{display:flex;gap:12px;align-items:center;margin-bottom:24px;font-weight:900}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,var(--coral),var(--gold),var(--teal));color:white}.logo small{display:block;color:var(--muted);font-size:12px}.nav{display:grid;gap:7px}.nav button{display:flex;gap:11px;align-items:center;min-height:46px;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:12px 14px;font-weight:850;text-align:left}.nav button.active,.nav button:hover{background:color-mix(in srgb,var(--teal) 12%,var(--card));color:var(--ink);box-shadow:inset 4px 0 0 var(--coral)}.profile{margin-top:24px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.main{min-width:0}.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px 34px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px)}.search{border:1px solid var(--line);border-radius:999px;background:var(--card);padding:14px 18px;color:var(--ink);outline:0}.theme{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink)}.views{padding:34px}.view{display:none}.view.active{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:.2;transform:translateY(8px)}}.hero{position:relative;display:grid;align-items:end;min-height:420px;overflow:hidden;border-radius:8px;padding:44px;color:white;box-shadow:var(--shadow);background:#08110f}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.58}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,12,10,.88),rgba(5,12,10,.22))}.hero>div{position:relative;z-index:1;max-width:760px}.k{margin:0 0 12px;color:var(--coral);font-size:12px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}h1{font-size:clamp(34px,5vw,68px);line-height:1.02;margin:0}h2{font-size:26px;margin:0 0 14px}h3{margin:0 0 8px}.hero p,.muted,p{line-height:1.65;color:var(--muted)}.hero p{color:rgba(255,255,255,.84);font-size:18px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.primary,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:0;border-radius:999px;padding:12px 18px;font-weight:900}.primary{background:var(--coral);color:white;box-shadow:0 14px 32px rgba(239,93,61,.23)}.ghost{background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.3)}.ghost.dark{background:var(--card);color:var(--ink);border:1px solid var(--line)}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,1fr);margin:18px 0}.card{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:22px;box-shadow:0 14px 38px rgba(20,31,28,.07)}.metric strong{display:block;font-size:38px}.metric span{color:var(--muted);font-weight:800}.two{grid-template-columns:1.1fr .9fr}.three{grid-template-columns:repeat(3,1fr)}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:13px 14px;outline:0}textarea{min-height:130px;resize:vertical}.plan,.post,.event{padding:15px;border-radius:8px;background:color-mix(in srgb,var(--teal) 9%,var(--card));margin-top:10px}.feed{display:grid;gap:12px}.form{display:grid;gap:12px}.orb{display:grid;place-items:center;width:min(270px,70vw);aspect-ratio:1;margin:auto;border-radius:50%;background:radial-gradient(circle at 38% 28%,#fff7b0,transparent 18%),radial-gradient(circle,#0fb9a7,var(--teal) 48%,var(--violet));color:white;font-size:28px;font-weight:900;box-shadow:0 0 60px rgba(15,185,167,.38);transition:transform 2.8s ease}.orb.big{transform:scale(1.15)}.timer{text-align:center;font-size:50px;font-weight:900;margin:20px}.media{overflow:hidden;padding:0}.media img{width:100%;height:190px;object-fit:cover}.media div{padding:18px}.tiny{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase}.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,var(--card));font-weight:900}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;border-radius:8px;background:var(--ink);color:var(--card);padding:15px 17px;font-weight:900;box-shadow:var(--shadow)}.hide{display:none}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.metrics,.three,.two{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top,.views{padding:14px}.nav,.metrics,.three,.two{grid-template-columns:1fr}.hero{min-height:520px;padding:24px}.actions{display:grid}.primary,.ghost{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo"><span class="mark">Co</span><span>CoWo<small>Conscious World</small></span></div><nav class="nav" id="nav"></nav><div class="profile"><b id="pname">Martin</b><p id="ppath">Hledac klidu</p><span class="pill" id="badge">Level 1</span></div></aside>
<section class="main"><header class="top"><input class="search" id="search" placeholder="Hledat meditace, forum, knihovnu, mista..."><button class="theme" id="theme">☾</button></header><main class="views" id="views"></main></section>
</div><div class="toast hide" id="toast"></div>
<script>
const img={hero:'https://static.donio.cz/photos/projects/full/2/2/22e03c5f-ef8f-4d6f-a540-5f68cb21957b.jpg',calm:'https://static.donio.cz/photos/projects/full/c/0/c035df64-44d4-45b4-a009-e5bb6019c774.jpg',forum:'https://static.donio.cz/photos/projects/full/1/9/19714473-ea1f-4be8-b50c-6fabe96aea59.jpg',library:'https://static.donio.cz/photos/projects/full/0/b/0bdf5c83-601e-4833-afa3-59699748c8b1.jpg',calendar:'https://static.donio.cz/photos/projects/full/2/6/26478e13-4278-4f37-8552-32b298c9c533.jpg',travel:'https://static.donio.cz/photos/projects/full/3/8/3835451c-b9f6-45f0-8747-60ed199c7fe2.jpg',music:'https://static.donio.cz/photos/projects/full/7/9/79e81ffb-0ab8-4b2f-8f15-2ffa4815cba8.jpg',reward:'https://static.donio.cz/photos/projects/full/3/d/3d831176-d30c-4096-af87-79d16d986371.jpg'};
const routes=[['domov','Domov'],['vstup','Vstup'],['meditace','Meditace'],['forum','Forum'],['knihovna','Knihovna'],['kalendar','Kalendar'],['cestovani','Cestovani'],['hudba','Hudba'],['podpora','Podpora']];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], key='cowo-public-v1';
let s=JSON.parse(localStorage.getItem(key)||'null')||{name:'Martin',path:'Hledac klidu',mood:'klid',journal:'',streak:0,minutes:0,level:1,last:'',posts:[['Tereza','Jak drzite ranni praxi?','Mne pomaha deset minut ticha pred telefonem.'],['Adam','Tip na tiche misto','Nad Berounkou je stezka, kde se da sednout a jen dychat.']],events:[['Ranni meditace',new Date().toISOString().slice(0,10),'Meditace']]};
function save(){localStorage.setItem(key,JSON.stringify(s));renderShell()}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.add('hide'),2400)}
function renderShell(){pname.textContent=s.name;ppath.textContent=s.path;badge.textContent='Level '+s.level;nav.innerHTML=routes.map(r=>`<button data-r="${r[0]}" class="${cur()==r[0]?'active':''}">${r[1]}</button>`).join('');$$('[data-r]').forEach(b=>b.onclick=()=>go(b.dataset.r));}
function cur(){return location.hash.replace('#','')||'domov'}function go(r){location.hash=r;render()}
function home(){return `<section class="hero"><img src="${img.hero}" alt=""><div><p class="k">Dnesni praxe</p><h1>Vitej ve svem vedomem prostoru.</h1><p>CoWo je online aplikace pro meditaci, komunitu, knihovnu, kalendar praxe, cestovani, hudbu a osobni rust.</p><div class="actions"><button class="primary" onclick="checkin()">Denni check-in</button><button class="ghost" onclick="go('meditace')">Spustit meditaci</button></div></div></section><div class="grid metrics"><div class="card metric"><strong>${s.streak}</strong><span>dni v praxi</span></div><div class="card metric"><strong>${s.minutes}</strong><span>minut meditace</span></div><div class="card metric"><strong>${s.posts.length}</strong><span>sdileni</span></div><div class="card metric"><strong>${s.level}</strong><span>uroven vedomi</span></div></div><div class="grid two"><div class="card"><h2>Doporuceni pro dnesek</h2>${plans()[s.mood].map(x=>`<div class="plan"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div><div class="card"><h2>Vedomy denik</h2><textarea id="journal">${s.journal}</textarea><button class="primary" onclick="s.journal=journal.value;save();toast('Denik ulozen')">Ulozit zapis</button></div></div>`}
function plans(){return{klid:[['7 minut ticha','Zavri oci a vrat pozornost k dechu.'],['Jemna hudba','Spust Solar Breath v modulu Hudba.'],['Zapis','Napis jednu vec, kterou dnes pustis.']],energie:[['Aktivni dech','Tri kola rytmickeho nadechu a vydechu.'],['Cesta ven','Najdi misto pro vedomou prochazku.'],['Sdileni','Pridej otazku do fora.']],komunita:[['Forum','Napis, co dnes potrebujes.'],['Setkani','Naplanu komunitni kruh.'],['Podpora','Ocen prispevek nekoho dalsiho.']]}}
function vstup(){return `<div class="grid two"><form class="card form" onsubmit="event.preventDefault();s.name=n.value;s.path=p.value;save();toast('Profil ulozen')"><p class="k">Vstup do komunity</p><h1>Profil a zamer</h1><input id="n" value="${s.name}" placeholder="Jmeno"><select id="p"><option>Hledac klidu</option><option>Pruvodce komunitou</option><option>Cestovatel vedomi</option><option>Tvurce svetla</option></select><textarea placeholder="Tvuj zamer">Chci najit lidi, mista a praxi, ktere podporuji vedomy zivot.</textarea><button class="primary">Ulozit profil</button></form><div class="card"><h2>Test naladeni</h2><p>Vyber, co je ti dnes nejblizsi.</p>${['klid','energie','komunita'].map(m=>`<button class="ghost dark" onclick="s.mood='${m}';save();toast('Naladeni: ${m}')">${m}</button> `).join('')}</div></div>`}
function meditace(){return `<div class="grid two"><div class="card"><p class="k">Meditace a dech</p><h1>Vedena praxe</h1><div class="orb" id="orb">Nadech</div><div class="timer" id="timer">05:00</div><div class="actions"><button class="primary" onclick="startMed()">Start</button><button class="ghost dark" onclick="resetMed()">Reset</button></div></div><div class="grid">${[['Navrat do stredu','5 min',img.calm],['Otevreni srdce','12 min',img.hero],['Dech pro soustredeni','8 min',img.music]].map(x=>`<div class="card media"><img src="${x[2]}"><div><span class="tiny">${x[1]}</span><h2>${x[0]}</h2><p>Vedomy navrat k telu a pritomnosti.</p></div></div>`).join('')}</div></div>`}
function forum(){return `<div class="grid two"><form class="card form" onsubmit="event.preventDefault();if(!pt.value||!pb.value)return toast('Dopln tema i text');s.posts.unshift([s.name,pt.value,pb.value]);save();render();toast('Prispevek publikovan')"><p class="k">Komunitni forum</p><h1>Sdilej s komunitou.</h1><input id="pt" placeholder="Tema"><textarea id="pb" placeholder="Co chces predat?"></textarea><button class="primary">Publikovat</button></form><div class="feed">${s.posts.map((p,i)=>`<div class="card"><span class="tiny">${p[0]}</span><h2>${p[1]}</h2><p>${p[2]}</p><button class="ghost dark" onclick="toast('Oceneni odeslano')">Ocenit</button></div>`).join('')}</div></div>`}
function knihovna(){let a=[['Mindfulness v kazdodennosti','Clanek',img.library],['Komunitni uceni','Pruvodce',img.forum],['Kalendar praxe','Nastroj',img.calendar]];return `<p class="k">Knihovna moudrosti</p><h1>Obsah pro rust.</h1><div class="grid three">${a.map(x=>`<div class="card media"><img src="${x[2]}"><div><span class="tiny">${x[1]}</span><h2>${x[0]}</h2><p>Prakticky obsah pro integraci, pozornost a osobni rozvoj.</p></div></div>`).join('')}</div>`}
function kalendar(){return `<div class="grid two"><form class="card form" onsubmit="event.preventDefault();if(!et.value)return toast('Dopln nazev');s.events.push([et.value,ed.value||new Date().toISOString().slice(0,10),ey.value]);save();render();toast('Udalost pridana')"><p class="k">Kalendar praxe</p><h1>Planovani ritualu.</h1><input id="et" placeholder="Nazev udalosti"><input id="ed" type="date"><select id="ey"><option>Meditace</option><option>Komunitni setkani</option><option>Cesta</option></select><button class="primary">Pridat</button></form><div class="card"><h2>Naplanovano</h2>${s.events.map(e=>`<div class="event"><b>${e[0]}</b><p>${e[2]} • ${e[1]}</p></div>`).join('')}</div></div>`}
function cestovani(){let a=[['Beskydsky tichy retreat','Retreat',img.travel],['Prazsky kruh dechu','Komunita',img.forum],['Cesta svetla Bali','Cesta',img.reward]];return `<p class="k">Vedomé cestovani</p><h1>Mista, retreaty a lide.</h1><div class="grid three">${a.map(x=>`<div class="card media"><img src="${x[2]}"><div><span class="tiny">${x[1]}</span><h2>${x[0]}</h2><p>Prostor pro praxi, setkani a vedomou cestu.</p><button class="primary" onclick="toast('Misto ulozeno')">Ulozit</button></div></div>`).join('')}</div>`}
let ac,nodes,track=216;function sound(){if(nodes){nodes.g.gain.value=0;nodes.o.stop();nodes.m.stop();nodes=null;return toast('Zvuk zastaven')}ac=ac||new AudioContext();let o=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();o.frequency.value=track;m.frequency.value=.08;mg.gain.value=9;g.gain.value=.045;m.connect(mg);mg.connect(o.frequency);o.connect(g);g.connect(ac.destination);o.start();m.start();nodes={o,m,g};toast('Zvuk spusten')}
function hudba(){return `<div class="grid two"><div class="card media"><img src="${img.music}"><div><p class="k">Hudba a zvuk</p><h1>Solar Breath</h1><p>Zvukova vrstva generovana primo v prohlizeci pres Web Audio.</p><button class="primary" onclick="sound()">Spustit / zastavit zvuk</button></div></div><div class="card"><h2>Zvukove krajiny</h2>${[['Solar Breath',216],['Forest Pulse',132],['Evening Integration',174]].map(x=>`<div class="plan"><b>${x[0]}</b><p>${x[1]} Hz</p><button class="ghost dark" onclick="track=${x[1]};toast('Vybrano ${x[0]}')">Vybrat</button></div>`).join('')}</div></div>`}
function podpora(){return `<div class="grid two"><div class="card media"><img src="${img.reward}"><div><p class="k">Podpora projektu</p><h1>Rocni clenstvi</h1><p>Prispevek 300 Kc a vice: rocni pristup, badge podporovatele a prednostni funkce.</p><button class="primary" onclick="s.level=Math.max(s.level,3);save();toast('Odmena aktivovana')">Aktivovat ukazku odmeny</button></div></div><div class="card"><h2>Rozpocet vyvoje</h2><div class="plan"><b>Vyvoj aplikace</b><p>35 %</p></div><div class="plan"><b>UX, design a 3D vizualy</b><p>20 %</p></div><div class="plan"><b>Bezpecnost a infrastruktura</b><p>18 %</p></div></div></div>`}
let left=300,timer,intv;function resetMed(){clearInterval(timer);clearInterval(intv);left=300;if($('#timer'))$('#timer').textContent='05:00';if($('#orb')){$('#orb').classList.remove('big');$('#orb').textContent='Nadech'}}function startMed(){if(timer)return;timer=setInterval(()=>{left--;let m=String(Math.floor(left/60)).padStart(2,'0'),sec=String(left%60).padStart(2,'0');$('#timer').textContent=m+':'+sec;if(left<=0){s.minutes+=5;s.level=Math.max(s.level,Math.floor(s.minutes/20)+1);save();resetMed();toast('Praxe dokoncena')}} ,1000);intv=setInterval(()=>{orb.classList.toggle('big');orb.textContent=orb.classList.contains('big')?'Vydech':'Nadech'},3200)}function checkin(){let d=new Date().toISOString().slice(0,10);if(s.last!==d){s.streak++;s.last=d}s.mood='klid';save();render();toast('Check-in ulozen')}
function render(){renderShell();let r=cur(),map={domov:home,vstup,meditace,forum,knihovna,kalendar,cestovani,hudba,podpora};views.innerHTML=(map[r]||home)()}theme.onclick=()=>document.body.classList.toggle('dark');search.oninput=e=>{let v=e.target.value.toLowerCase();if(v.includes('medit'))go('meditace');if(v.includes('forum'))go('forum');if(v.includes('knih'))go('knihovna');if(v.includes('cest')||v.includes('mist'))go('cestovani')};addEventListener('hashchange',render);render();
</script>
</body>
</html>
